spring.application.name=Product Management
server.port=8082

# API Base URL for frontend
api.base-url=${API_BASE_URL:http://localhost:8082}

# Payment Service URL for Docker environment
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8081}

spring.datasource.url=jdbc:postgresql://localhost:5432/pmdb
spring.datasource.username=pmuser
spring.datasource.password=pmpassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



