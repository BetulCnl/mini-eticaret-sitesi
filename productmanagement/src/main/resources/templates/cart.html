<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepetim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { margin-top: 50px; }
        .card-header { display:flex; justify-content:space-between; align-items:center; }
        table thead th { background-color:#343a40; color:white; }
        .btn-sm { padding: 2px 6px; font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h3>Sepetim</h3>
            <div>
                <a href="/products" class="btn btn-primary">Ürünlere Dön</a>
                <button id="logoutButton" class="btn btn-danger">Çıkış Yap</button>
            </div>
        </div>
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead>
                <tr>
                    <th>Ürün</th>
                    <th>Fiyat</th>
                    <th>Miktar</th>
                    <th>Toplam</th>
                    <th>İşlem</th>
                </tr>
                </thead>
                <tbody id="cart-body"></tbody>
            </table>
            <h5 id="cart-total" class="mt-3">Toplam: 0 TL</h5>
            <button id="checkoutBtn" class="btn btn-success mt-2">Ödemeye Geç</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('token');
        const deviceId = localStorage.getItem('deviceId'); // deviceId'yi al

        // Token veya deviceId yoksa login sayfasına yönlendir
        if (!token || !deviceId) {
            localStorage.clear(); // Güvenlik için her şeyi temizle
            window.location.href = '/login';
            return; // Kodun devam etmesini engelle
        }

        const cartBody = document.getElementById('cart-body');
        const cartTotalEl = document.getElementById('cart-total');

        // Tüm fetch istekleri için ortak header'lar
        const commonHeaders = {
            'Authorization': 'Bearer ' + token,
            'X-Device-Id': deviceId,
            'Content-Type': 'application/json'
        };

        async function fetchCart() {
            try {
                const res = await fetch('/api/cart', {
                    headers: commonHeaders
                });
                if (!res.ok) {
                    // Sunucudan gelen hata mesajını göstermeye çalış
                    const errorData = await res.json().catch(() => null);
                    const errorMessage = errorData ? errorData.message : 'Sepet yüklenirken bir hata oluştu.';
                    throw new Error(errorMessage);
                }
                const items = await res.json();
                renderCart(items);
            } catch (err) {
                console.error(err);
                cartBody.innerHTML = `<tr><td colspan="5" class="text-center text-danger">${err.message}</td></tr>`;
            }
        }

        function renderCart(items) {
            cartBody.innerHTML = '';
            let total = 0;
            if (items.length === 0) {
                cartBody.innerHTML = '<tr><td colspan="5" class="text-center">Sepetiniz boş.</td></tr>';
                cartTotalEl.textContent = 'Toplam: 0 TL';
                return;
            }
            items.forEach(item => {
                const price = item.product ? item.product.price : 0;
                const quantity = item.quantity || 0;
                const subtotal = price * quantity;
                total += subtotal;

                const row = document.createElement('tr');
                row.innerHTML = `
                <td>${item.product ? item.product.name : 'Ürün Adı Yok'}</td>
                <td>${price.toFixed(2)} TL</td>
                <td>
                    <input type="number" min="1" value="${quantity}" style="width:60px;" class="quantity-input" data-id="${item.id}">
                </td>
                <td>${subtotal.toFixed(2)} TL</td>
                <td>
                    <button class="btn btn-sm btn-danger remove-btn" data-id="${item.id}">Sil</button>
                </td>
            `;
                cartBody.appendChild(row);
            });
            cartTotalEl.textContent = `Toplam: ${total.toFixed(2)} TL`;

            // Event listeners
            document.querySelectorAll('.remove-btn').forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.dataset.id;
                    await fetch(`/api/cart/${id}`, {
                        method: 'DELETE',
                        headers: commonHeaders
                    });
                    fetchCart();
                };
            });
            document.querySelectorAll('.quantity-input').forEach(input => {
                input.onchange = async () => {
                    const id = input.dataset.id;
                    const quantity = parseInt(input.value) || 1;
                    await fetch(`/api/cart/${id}`, {
                        method: 'PUT',
                        headers: commonHeaders,
                        body: JSON.stringify({ quantity })
                    });
                    fetchCart();
                };
            });
        }

        document.getElementById('checkoutBtn').onclick = async () => {
            try {
                // Önce backend'de siparişi oluştur
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: commonHeaders // Bu header'lar script'in başında zaten tanımlı
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({ message: 'Sipariş oluşturulurken bir hata oluştu.' }));
                    throw new Error(err.message);
                }

                const order = await res.json();
                // Sipariş ID'si ile purchase sayfasına yönlendir
                window.location.href = `/purchase?orderId=${order.id}`;

            } catch (err) {
                // Hata durumunda kullanıcıyı bilgilendir
                alert('Hata: ' + err.message);
            }
        };

        document.getElementById('logoutButton').onclick = () => {
            // Logout'ta deviceId'yi de göndererek sunucudaki session'ı sil
            fetch('/api/auth/logout', {
                method: 'POST',
                headers: commonHeaders
            }).finally(() => {
                localStorage.clear();
                window.location.href = '/login';
            });
        };

        fetchCart();
    });
</script>
</body>
</html>
