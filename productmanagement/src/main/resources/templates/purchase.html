<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödeme</title>
</head>
<body>
<header style="display:flex; justify-content:space-between; padding:10px; background-color:#f1f1f1;">
    <div id="userInfo"></div>
    <button onclick="logout()">Çıkış Yap</button>
</header>

<h1>Ödeme Sayfası</h1>
<p id="order-info">Sipariş ID: ...</p>

<button onclick="handlePayment('SUCCESS')">SUCCESS</button>
<button onclick="handlePayment('FAILED')">FAILED</button>

<script>
    const token = localStorage.getItem('token');
    const deviceId = localStorage.getItem('deviceId'); // deviceId'yi al

    if(!token || !deviceId) { // deviceId kontrolü eklendi
        localStorage.clear();
        window.location.href='/login';
    }

    const userName = localStorage.getItem('userName');
    const userEmail = localStorage.getItem('userEmail');
    if(userName && userEmail) document.getElementById('userInfo').innerHTML = `<strong>Kullanıcı:</strong> ${userName} (${userEmail})`;

    function logout(){
        // Logout'u da deviceId'li yapalım
        const headers = { 'Authorization': 'Bearer ' + token, 'X-Device-Id': deviceId };
        fetch('/api/auth/logout', { method: 'POST', headers })
            .finally(() => {
                localStorage.clear();
                window.location.href = '/login';
            });
    }

    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');
    document.getElementById('order-info').textContent = orderId ? `Sipariş ID: ${orderId}` : "Sipariş ID bulunamadı!";

    const apiBaseUrl = 'http://localhost:8082';

    async function handlePayment(status){
        if(!orderId){ alert('Sipariş ID bulunamadı!'); return; }
        const endpoint = status==='SUCCESS'?'complete':'fail';
        const url = `${apiBaseUrl}/api/orders/${orderId}/${endpoint}`;

        try{
            const res = await fetch(url,{
                method:'POST',
                headers:{
                    'Authorization':'Bearer '+token,
                    'X-Device-Id': deviceId, // Eksik olan header eklendi
                    'Content-Type':'application/json'
                }
                // Body gereksiz olduğu için kaldırıldı
            });

            if(!res.ok){
                const errData = await res.json().catch(()=>null);
                throw new Error(errData?.message || 'Ödeme işlemi gerçekleştirilemedi.');
            }

            alert(status==='SUCCESS'
                ? `Siparişiniz (ID:${orderId}) başarıyla tamamlandı!`
                : `Ödeme başarısız oldu. Siparişiniz (ID:${orderId}) iptal edildi.`);

            window.location.href='/myOrders';
        } catch(err){
            alert('Hata: '+err.message);
        }
    }
</script>
</body>
</html>
