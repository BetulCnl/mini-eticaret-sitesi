<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siparişlerim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { margin-top: 50px; }
        .table thead th { background-color: #343a40; color: white; }
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .pagination-container { margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h3>Siparişlerim</h3>
            <div>
                <a href="/products" class="btn btn-primary">Ürünlere Geri Dön</a>
                <button id="logoutButton" class="btn btn-danger">Çıkış Yap</button>
            </div>
        </div>
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead>
                <tr>
                    <th>Sipariş ID</th>
                    <th>Tarih</th>
                    <th>Durum</th>
                    <th>Toplam Tutar</th>
                    <th>Ürünler</th>
                    <th>İşlem</th>
                </tr>
                </thead>
                <tbody id="orders-table-body"></tbody>
            </table>

            <div class="pagination-container d-flex justify-content-center align-items-center gap-2">
                <button id="prevPageBtn" class="btn btn-secondary btn-sm">« Önceki</button>
                <span id="pageIndicator"></span>
                <button id="nextPageBtn" class="btn btn-secondary btn-sm">Sonraki »</button>
            </div>
        </div>
    </div>
</div>

<script>
    // DeviceId oluştur
    if (!localStorage.getItem('deviceId')) {
        localStorage.setItem('deviceId', 'device-' + Math.random().toString(36).substring(2, 15));
    }
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login';
    }

    let currentPage = 0;
    const pageSize = 10;

    // Güvenli fetch (JSON ya da text yakalar)
    async function safeFetch(url, options = {}) {
        const token = localStorage.getItem('token');
        const deviceId = localStorage.getItem('deviceId');

        options.headers = {
            ...options.headers,
            'Authorization': 'Bearer ' + token,
            'X-Device-Id': deviceId,
            'Content-Type': 'application/json'
        };

        const response = await fetch(url, options);

        // JSON veya Text yakala
        let data;
        const text = await response.text();
        try {
            data = JSON.parse(text);
        } catch {
            data = { message: text };
        }

        return { ok: response.ok, status: response.status, data };
    }

    async function loadOrders(page) {
        try {
            const { ok, data } = await safeFetch(`/api/orders?page=${page}&size=${pageSize}`);
            const tableBody = document.getElementById('orders-table-body');
            tableBody.innerHTML = '';

            if (ok && data.content && data.content.length > 0) {
                data.content.forEach(order => {
                    const itemsDetails = order.items
                        .map(item => `${item.productName} (x${item.quantity}) - ${item.unitPrice.toFixed(2)} TL`)
                        .join('<br>');

                    const actionButton = order.orderStatus !== 'CANCELLED'
                        ? `<button class="btn btn-sm btn-danger cancel-btn" data-id="${order.id}">İptal Et</button>`
                        : `<span class="text-muted">İptal Edildi</span>`;

                    const row = `
                        <tr>
                            <td>${order.id}</td>
                            <td>${new Date(order.createdAt).toLocaleDateString()}</td>
                            <td><span class="badge bg-info">${order.orderStatus}</span></td>
                            <td>${order.totalAmount.toFixed(2)} TL</td>
                            <td>${itemsDetails}</td>
                            <td>${actionButton}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });

                document.getElementById('pageIndicator').textContent = `Sayfa: ${data.number + 1} / ${data.totalPages}`;
                document.getElementById('prevPageBtn').disabled = data.first;
                document.getElementById('nextPageBtn').disabled = data.last;

                document.querySelectorAll('.cancel-btn').forEach(btn => {
                    btn.addEventListener('click', async function () {
                        const orderId = this.dataset.id;
                        const row = this.closest('tr');
                        if (confirm("Bu siparişi iptal etmek istediğinize emin misiniz?")) {
                            const { ok, data } = await safeFetch(`/api/orders/${orderId}/cancel`, { method: 'PATCH' });

                            if (ok) {
                                row.querySelector('td:nth-child(3) .badge').textContent = data.orderStatus || "CANCELLED";
                                row.querySelector('td:nth-child(6)').innerHTML = '<span class="text-muted">İptal Edildi</span>';
                            } else {
                                alert(data.message || "İptal edilemedi!");
                            }
                        }
                    });
                });

            } else {
                tableBody.innerHTML = '<tr><td colspan="6" class="text-center">Henüz siparişiniz bulunmamaktadır.</td></tr>';
                document.getElementById('pageIndicator').textContent = '';
                document.getElementById('prevPageBtn').disabled = true;
                document.getElementById('nextPageBtn').disabled = true;
            }
        } catch (error) {
            console.error(error);
            document.getElementById('orders-table-body').innerHTML =
                `<tr><td colspan="6" class="text-center text-danger">${error.message}</td></tr>`;
        }
    }

    document.getElementById('prevPageBtn').addEventListener('click', () => {
        if (currentPage > 0) {
            currentPage--;
            loadOrders(currentPage);
        }
    });
    document.getElementById('nextPageBtn').addEventListener('click', () => {
        currentPage++;
        loadOrders(currentPage);
    });

    // Logout
    document.getElementById('logoutButton').addEventListener('click', () => {
        localStorage.removeItem('token');
        window.location.href = '/login';
    });

    window.onload = () => loadOrders(currentPage);
</script>

</body>
</html>
