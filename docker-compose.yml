version: "3.9" # veya 3.8 / 3.7

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: pmdb
      POSTGRES_USER: pmuser
      POSTGRES_PASSWORD: pmpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmuser -d pmdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
